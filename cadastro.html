<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Instituto Elo Verde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho / Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <div class="logo">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">Elo Verde</span>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="cadastro.html" class="active">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Banner da Página -->
  <section class="page-banner">
    <div class="container">
      <h1>Faça Parte do Instituto Elo Verde</h1>
      <p>Cadastre-se para se tornar voluntário ou apoiar nossas causas na comunidade.</p>
    </div>
  </section>

  <!-- Formulário -->
  <main class="form-container">
  <form>
    <div class="form-group">
      <label for="nome">Nome Completo *</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
    </div>

    <div class="form-group">
      <label for="email">E-mail *</label>
      <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
    </div>

    <div class="form-group">
      <label for="telefone">Telefone / WhatsApp *</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
    </div>

    <div class="form-group">
      <label for="participacao">Como gostaria de participar?</label>
      <select id="participacao" name="participacao">
        <option value="voluntario">Quero ser Voluntário</option>
        <option value="doador">Quero Apoiar financeiramente</option>
        <option value="parceiro">Parceria Institucional / Empresa</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mensagem">Mensagem / Observações</label>
      <textarea id="mensagem" name="mensagem" placeholder="Conte um pouco sobre suas motivações ou disponibilidade..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Enviar Cadastro</button>
  </form>
</main>

          <div class="form-group">
            <label for="tipo">Como gostaria de participar?</label>
            <select id="tipo" name="tipo">
              <option value="voluntario">Quero ser Voluntário</option>
              <option value="doador">Quero ser Doador Recorrente</option>
              <option value="parceiro">Empresa / Parceiro Institucional</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mensagem">Mensagem / Observações</label>
            <textarea id="mensagem" name="mensagem" rows="4" placeholder="Conte um pouco sobre suas motivações ou disponibilidade..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Enviar Cadastro</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Rodapé -->
  <footer class="footer">
    <div class="container text-center">
      <p>© Instituto Elo Verde. Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
